<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6efdf">
  <title>От лаваша до кочари</title>
  <link rel="icon" href="images/lavash.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>От лаваша<br>до <span>кочари</span></h1>
    </header>

    <section class="game" aria-label="Собери застолье">
      <div class="scene-heading">
        <span id="stage-name">01 / ЛАВАШ</span>
      </div>
      <div class="table" id="table">
        <div class="runner" aria-hidden="true"></div>
        <div class="dish-position">
          <button id="dish" class="dish" type="button" tabindex="-1" aria-label="Добавить клик к застолью">
            <img class="lavash" src="images/lavash.svg" alt="Лаваш" draggable="false">
            <img id="meat" class="ingredient" src="images/meat.svg" alt="Шашлык" draggable="false" hidden>
            <img id="vegetables" class="ingredient" src="images/vegetables.svg" alt="Помидор, зелень и лук" draggable="false" hidden>
          </button>
        </div>
        <img id="wine" class="wine" src="images/wine.svg" alt="Бутылка вина и бокал" draggable="false" hidden>
      </div>

      <div class="game-info">
        <p id="message" class="message" aria-live="polite">Лаваш есть. Где шашлык?</p>
        <div class="progress-label"><span id="next-stage">До шашлыка — 6 кликов</span><span><strong id="count">0</strong> / 50</span></div>
        <progress id="progress" max="50" value="0" aria-label="Прогресс застолья"></progress>
        <p id="hint" class="hint">Нажимай на еду</p>
        <button id="restart" class="restart" type="button" hidden>Ещё одно застолье ↻</button>
      </div>
    </section>

    <ol class="stages" aria-label="Этапы застолья">
      <li class="current" aria-current="step"><span>01</span> Лаваш</li>
      <li><span>02</span> Шашлык</li>
      <li><span>03</span> Овощи</li>
      <li><span>04</span> Вино</li>
      <li><span>05</span> Кочари!</li>
    </ol>
  </main>
</body>
</html>
